# Builds the Windows installer and publishes it as a GitHub Release.
#   Release:  git tag v0.2.0 && git push origin v0.2.0
#   Test build without releasing: Actions > Release > Run workflow (the installer is kept as a run artifact).
# The installer is attached twice: Codeville-Setup-<version>.exe, and Codeville-Setup.exe so that
# https://github.com/dharaneechinnu/codeville/releases/latest/download/Codeville-Setup.exe always gets the newest.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Backend packages
        shell: bash
        run: |
          python -m venv backend/.venv
          backend/.venv/Scripts/python.exe -m pip install --upgrade pip
          backend/.venv/Scripts/python.exe -m pip install -r backend/requirements.txt

      - name: App packages
        run: npm ci

      - name: Tests
        run: |
          npm test
          npm run typecheck
          npm run test:gestures

      - name: Build the installer
        run: npm run dist

      - name: Name the files
        id: files
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          cp "release/Codeville-Setup-$version.exe" release/Codeville-Setup.exe
          (cd release && sha256sum "Codeville-Setup-$version.exe" Codeville-Setup.exe > SHA256SUMS.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -l release

      - name: Keep the installer with this run
        uses: actions/upload-artifact@v4
        with:
          name: Codeville-Setup-${{ steps.files.outputs.version }}
          path: |
            release/Codeville-Setup-*.exe
            release/SHA256SUMS.txt
          retention-days: 14

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Codeville ${{ steps.files.outputs.version }}
          generate_release_notes: true
          body: |
            ## Install on Windows
            1. Download **Codeville-Setup-${{ steps.files.outputs.version }}.exe** below.
            2. Run it. The installer is not code signed yet, so Windows SmartScreen may warn: choose **More info**, then **Run anyway**.
            3. On first run, the welcome screen checks Git, Claude Code and Node.js and connects the Claude Code plugin.

            Python is bundled; nothing else to install. `SHA256SUMS.txt` lists the checksums.
          files: |
            release/Codeville-Setup-${{ steps.files.outputs.version }}.exe
            release/Codeville-Setup.exe
            release/SHA256SUMS.txt
